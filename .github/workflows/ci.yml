name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test SupaLookin
        run: |
          set -euo pipefail
          xcodebuild \
            -project SupaLookin.xcodeproj \
            -scheme SupaLookin \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            test
